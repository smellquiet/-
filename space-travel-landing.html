<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;
// framer-motion UMD 全局名是 `Motion`（非 FramerMotion）。若未加载成功则兜底为静态标签，避免整页黑屏。
const M = window.Motion;

/* ============ FadingVideo ============ */
function FadingVideo({ src, className, style }) {
  const ref = useRef(null);
  const rafRef = useRef(null);
  const fadingOutRef = useRef(false);
  const FADE_MS = 500;
  const FADE_OUT_LEAD = 0.55;

  const fadeTo = (target, duration) => {
    const video = ref.current;
    if (!video) return;
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    const startOpacity = parseFloat(video.style.opacity || '0');
    const start = performance.now();
    const animate = (now) => {
      const t = Math.min((now - start) / duration, 1);
      const val = startOpacity + (target - startOpacity) * t;
      video.style.opacity = String(val);
      if (t < 1) { rafRef.current = requestAnimationFrame(animate); }
      else { rafRef.current = null; }
    };
    rafRef.current = requestAnimationFrame(animate);
  };

  useEffect(() => {
    const video = ref.current;
    if (!video) return;
    const onLoaded = () => { video.style.opacity = '0'; video.play().catch(()=>{}); fadeTo(1, FADE_MS); };
    const onTimeUpdate = () => {
      const remain = video.duration - video.currentTime;
      if (!fadingOutRef.current && remain <= FADE_OUT_LEAD && remain > 0) {
        fadingOutRef.current = true;
        fadeTo(0, FADE_MS);
      }
    };
    const onEnded = () => {
      video.style.opacity = '0';
      setTimeout(() => {
        video.currentTime = 0;
        video.play().catch(()=>{});
        fadingOutRef.current = false;
        fadeTo(1, FADE_MS);
      }, 100);
    };
    video.addEventListener('loadeddata', onLoaded);
    video.addEventListener('timeupdate', onTimeUpdate);
    video.addEventListener('ended', onEnded);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      video.removeEventListener('loadeddata', onLoaded);
      video.removeEventListener('timeupdate', onTimeUpdate);
      video.removeEventListener('ended', onEnded);
    };
  }, []);

  return (
    <video ref={ref} src={src} className={className} style={style}
      autoPlay muted playsInline preload="auto" />
  );
}
window.FadingVideo = FadingVideo;

/* ============ BlurText ============ */
function BlurText({ text, className }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { setVisible(true); obs.disconnect(); } });
    }, { threshold: 0.1 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  const words = text.split(' ');
  return (
    <p ref={ref} className={"blurtext " + (className || "")}>
      {words.map((w, i) => (
        <motion.span key={i}
          initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
          animate={visible
            ? { filter: ['blur(10px)','blur(5px)','blur(0px)'], opacity: [0, 0.5, 1], y: [50, -5, 0] }
            : {}}
          transition={{ duration: 0.7, times: [0, 0.5, 1], ease: 'easeOut', delay: (i * 100) / 1000 }}>
          {w}
        </motion.span>
      ))}
    </p>
  );
}
window.BlurText = BlurText;
