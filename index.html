      fps: v => setStat(st => ({ ...st, fps: String(v) })),
      quality: (q, msg) => { setQLevel(q); setTip(msg); },
      err: m => setTip(m),
      apply: (s, p) => { state.palette = p; regenerate(s, p); },
      random: () => regenerate(),
      qIndex: () => qIndex,
    };
    resize();
    regenerate();
    live = true; start();

    const ro = window.ResizeObserver ? new ResizeObserver(() => { resize(); regenerate(seed); }) : null;
    ro && ro.observe(wrap);
    const onWinResize = () => { resize(); regenerate(seed); };
    window.addEventListener('resize', onWinResize);
    let io = null;
    if (window.IntersectionObserver) {
      io = new IntersectionObserver((es) => {
        es.forEach(e => {
          visible = e.isIntersecting;
          if (visible) start(); else if (raf) { cancelAnimationFrame(raf); raf = 0; }
        });
      }, { threshold: 0 });
      io.observe(wrap);
    }
    const onVis = () => {
      live = !document.hidden;
      if (live) start(); else if (raf) { cancelAnimationFrame(raf); raf = 0; }
    };
    document.addEventListener('visibilitychange', onVis);

      live = false;
      if (raf) cancelAnimationFrame(raf);

      io && io.disconnect();

  const submit = (e) => {
    if (e) e.preventDefault();
    const raw = (inputRef.current && inputRef.current.value || '').trim();
    if (!raw) { apiRef.current && apiRef.current.random(); setTip('已随机生成一个新流场'); return; }
    const p = ffParseInput(raw, palette);
    if (p.kind === 'random') return;
    if (p.palette) setPalette(p.palette);
    apiRef.current && apiRef.current.apply(p.seed, p.palette || palette);
    if (p.kind === 'number') {
      setTip('种子 ' + p.seed + '（直接取你输入的数字' + (p.raw !== p.seed ? '，模 1000000' : '') + '） · 配色 ' + (p.palette || palette));
    } else if (p.keyword) {
      setTip('关键词「' + p.keyword + '」→ ' + p.palette + ' 配色 · 种子 ' + p.seed);
    } else {
      setTip('种子 ' + p.seed + ' · 配色 ' + (p.palette || palette));
    }
    setValue(raw);
  };
  const pickPreset = (label, key) => {
    if (inputRef.current) inputRef.current.value = label;
    setValue(label); setPalette(key);
    apiRef.current && apiRef.current.apply(ffHash(label), key);
    setTip('预设「' + label + '」 · 种子 ' + ffHash(label));
  };
  return (<div ref={wrapRef} className="absolute inset-0">
    <canvas ref={canvasRef} className="flow-canvas" aria-label="粒子流场生成艺术背景"></canvas>
    <div className="flow-glow" />
    <div className="flow-vignette" />
    <form onSubmit={submit} className="ff-panel absolute right-4 md:right-6 top-20 md:top-24 z-20">
      <div className="flex items-baseline gap-2">
        <span className="text-[11px] font-semibold tracking-[0.14em] uppercase" style={{color:'#ECE7F2'}}>Tidal Chromatics</span>
      </div>
      <div className="text-[9px] tracking-[0.08em] uppercase mb-3" style={{color:'rgba(155,147,171,0.9)'}}>Noise-Driven <span style={{background:'linear-gradient(90deg,#ff7a59,#b06bff)',WebkitBackgroundClip:'text',backgroundClip:'text',color:'transparent'}}>Flow Field</span></div>
      <div className="ff-stat"><span className="k">SEED</span>
        <button type="button" className="v ff-accent ff-stat__edit" data-ff="seed" title="点击可直接输入种子" onClick={() => { if (inputRef.current) { inputRef.current.value = stat.seed; setValue(stat.seed); inputRef.current.focus(); } setTip('把数字粘进下方输入框再点「生成」，即可复现这个种子'); }}>{stat.seed}</button>
      </div>
      <div className="ff-stat"><span className="k">PARTICLES</span><span className="v" data-ff="parts">{stat.parts}</span></div>
      <div className="ff-stat"><span className="k">FPS</span><span className="v" data-ff="fps">{stat.fps}</span></div>
      <div className="mt-3 text-[10px] leading-[1.5]" data-ff="hint" style={{color:'rgba(225,224,204,0.6)'}}>{tip || note}</div>
      <input ref={inputRef} className="ff-input mt-2" defaultValue={value} placeholder="输入种子数字或任意文字"
        onInput={ev => { setValue(ev.target.value); }}
        onChange={ev => { if (ev.target.value !== value) setValue(ev.target.value); }} />
      <div className="flex flex-wrap gap-1.5 mt-2">
        {FF_PRESETS.map(([label, key]) => (
          <button key={key} type="button" className={'ff-chip' + (palette === key && value === label ? ' ff-chip--on' : '')} onClick={() => pickPreset(label, key)}>{label}</button>
        ))}
      </div>
      <div className="flex gap-2 mt-3">
        <button type="submit" className="ff-btn ff-btn--primary flex-1">生成</button>
        <button type="button" className="ff-btn" onClick={() => { apiRef.current && apiRef.current.random(); setTip('已随机生成一个新流场'); }}>随机</button>
        <button type="button" className="ff-btn" onClick={() => { apiRef.current && apiRef.current.savePNG(); setTip('已保存当前流场为 PNG'); }}>保存</button>
      </div>
      <div className="mt-3 pt-2.5" style={{borderTop:'1px solid rgba(255,255,255,0.08)'}}>
        <div className="flex items-center justify-between mb-1.5">
          <span className="text-[10px] tracking-[0.08em] uppercase" style={{color:'rgba(225,224,204,0.55)'}}>画质</span>
          <span className="text-[10px]" style={{color:'rgba(255,156,122,0.9)'}}>{qLevel.label} · {qLevel.count}</span>
        </div>
        <div className="flex gap-1.5">
          {FF_QUALITY.map((q, i) => (
            <button key={q.id} type="button" className={'ff-chip flex-1' + (qLevel.id === q.id ? ' ff-chip--on' : '')} onClick={() => setQ(i)}>{q.label}</button>
          ))}
        </div>
        <div className="mt-1.5 text-[9px] leading-[1.45]" style={{color:'rgba(225,224,204,0.42)'}}>卡顿时会自动降档；点这里可手动锁定。</div>
      </div>
    </form>
  </div>);
}

  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = value; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      return true;

  };
  const copy = () => {
    const done = () => {
      setCopied(true);

      timer.current = setTimeout(() => setCopied(false), 1600);
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(value).then(done).catch(() => { if (fallback()) done(); });
      else if (fallback()) done();
    } catch (e) { /* 忽略复制失败 */ }
  };
  return (
    <div className="contact-row">
      <Icon className="w-4 h-4 text-primary/70 shrink-0" />

/* ============ 访客留言簿 ============ */
function Guestbook() {
  const KEY = 'cwj-guestbook', MAX = 50;
  const [list, setList] = useState(() => STORE.get(KEY, []));
  const [count, setCount] = useState(0);
  const [note, setNote] = useState('');
  const nameRef = useRef(null);
  const textRef = useRef(null);
  const noteTimer = useRef(0);
  // 输入框用非受控 + 原生 input 监听：字数实时更新不依赖 React onChange，粘贴/输入法也稳
  useEffect(() => {
    const el = textRef.current;
    if (!el) return undefined;
    const onInput = () => setCount(el.value.length);
    el.addEventListener('input', onInput);
    return () => el.removeEventListener('input', onInput);
  }, []);
  useEffect(() => () => clearTimeout(noteTimer.current), []);
  const flash = (m) => { setNote(m); clearTimeout(noteTimer.current); noteTimer.current = setTimeout(() => setNote(''), 2600); };
  const submit = (e) => {
    if (e) e.preventDefault();
    const t = ((textRef.current && textRef.current.value) || '').trim().slice(0, 200);
    if (!t) { flash('说点什么再走吧 ~'); return; }
    const rawName = ((nameRef.current && nameRef.current.value) || '').trim().slice(0, 16);
    const next = [{ n: rawName || '匿名访客', t, at: Date.now() }].concat(list).slice(0, MAX);
    setList(next);
    STORE.set(KEY, next);
    STORE.set('cwj-gb-name', rawName);
    if (textRef.current) textRef.current.value = '';
    setCount(0);
    flash('已留下，谢谢你 ✦');
  };
  const fmt = (at) => { try { return new Date(at).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
  return (
    <div className="gb">
      <div className="gb-head">
        <span className="gb-head__t">留言簿</span>
        <span className="gb-head__s">{list.length ? `已有 ${list.length} 条 · 存放在你的浏览器里` : '读完这句话，也可以留一句'}</span>
      </div>
      <form className="gb-form" onSubmit={submit}>
        <input ref={nameRef} type="text" defaultValue={STORE.get('cwj-gb-name', '')} maxLength={16} placeholder="你的称呼（可留空，默认「匿名访客」）" aria-label="你的称呼" />
        <textarea ref={textRef} maxLength={200} placeholder="想说点什么……（200 字以内）" aria-label="留言内容" />
        <div className="gb-row">
          <span className="gb-count">{count} / 200{note ? <span className="gb-note">　{note}</span> : null}</span>
          <button type="submit" className="gb-submit" disabled={count === 0}>留下留言</button>
        </div>
      </form>
      <div className="gb-list">
        {list.length === 0 && <div className="gb-empty">还没有人留言 —— 留下第一条吧</div>}
        {list.map((m, i) => (
          <div className="gb-item" key={m.at + '-' + i}>
            <div className="gb-item__top">
              <span className="gb-item__name">{m.n}</span>
              <span className="gb-item__time">{fmt(m.at)}</span>
              {i === 0 && list.length > 1 && <span className="gb-item__badge">最新</span>}
            </div>
            <div className="gb-item__text">{m.t}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============ 关卡三：找不同 ============ */
function SpotDiff({ onSolved }) {
  const POOL = ['✦','✧','◆','◇','▲','△','●','○','★','☆','■','□','✚','❖','✱','✵'];
  const SIZE = 25, TOTAL = 5;
  const build = () => {
    const a = Array.from({ length: SIZE }, () => POOL[Math.floor(Math.random() * POOL.length)]);
    const picks = [];
    while (picks.length < TOTAL) { const k = Math.floor(Math.random() * SIZE); if (picks.indexOf(k) < 0) picks.push(k); }
    const b = a.slice();
    picks.forEach(k => { let s = a[k]; while (s === a[k]) s = POOL[Math.floor(Math.random() * POOL.length)]; b[k] = s; });
    return { a, b, diff: picks };
  };
  const [data, setData] = useState(build);
  const [found, setFound] = useState([]);
  const [missIdx, setMissIdx] = useState(-1);
  const [miss, setMiss] = useState(0);
  const [started, setStarted] = useState(false);
  const [secs, setSecs] = useState(0);
  const done = found.length === TOTAL;
  useEffect(() => { if (!started || done) return undefined; const id = setInterval(() => setSecs(s => s + 1), 1000); return () => clearInterval(id); }, [started, done]);
  useEffect(() => { if (done && onSolved) onSolved(); }, [done]);
  const hit = (i) => {
    if (done || found.indexOf(i) >= 0 || missIdx >= 0) return;
    setStarted(true);
    if (data.diff.indexOf(i) >= 0) setFound(f => f.concat(i));
    else { setMiss(m => m + 1); setMissIdx(i); setTimeout(() => setMissIdx(-1), 420); }
  };
  const restart = () => { setData(build()); setFound([]); setMiss(0); setMissIdx(-1); setStarted(false); setSecs(0); };
  const cellCls = i => `sd-cell${found.indexOf(i) >= 0 ? ' sd-cell--found' : ''}${missIdx === i ? ' sd-cell--miss' : ''}`;
  return (
    <div className="sd-wrap">
      <div className="sd-hud">
        <span>已找出 <b>{found.length} / {TOTAL}</b></span>
        <span>误点 <b>{miss}</b></span>
        <span>用时 <b>{secs}s</b></span>
        <button onClick={restart} className="sd-hintbtn">换一局</button>
      </div>
      <div className="sd-boards">
        <div className="sd-board">
          {data.a.map((s, i) => (<button key={i} className={cellCls(i)} onClick={() => hit(i)} aria-label={`左图第 ${i + 1} 格`}>{s}</button>))}
        </div>
        <div className="sd-board">
          {data.b.map((s, i) => (<button key={i} className={cellCls(i)} onClick={() => hit(i)} aria-label={`右图第 ${i + 1} 格`}>{s}</button>))}
        </div>
      </div>
      <p className="text-gray-500 text-[11px] text-center mt-4">左右两幅符号阵列中有 <span className="text-primary">{TOTAL}</span> 处不同 —— 点中任意一侧的对应位置即可标记。</p>
      {done && (
        <div className="sd-done mt-6">
          <div className="font-serif italic text-primary text-2xl md:text-3xl mb-1">全部找齐</div>
          <p className="text-gray-400 text-xs sm:text-sm mb-4">用时 <span className="text-primary">{secs}</span> 秒，误点 <span className="text-primary">{miss}</span> 次。</p>
          <button onClick={restart} className="text-[11px] text-primary/80 border border-primary/30 rounded-full px-5 py-2 hover:bg-primary/10 hover:text-primary transition-colors">再来一局</button>
        </div>
      )}
    </div>
  );
}

/* ============ 记忆翻牌小游戏 ============ */
function MemoryGame({ onSolved }) {
  const FACES = ['图片/4.png','图片/5.png','图片/6.png','图片/7.png','图片/8.png','图片/9.png'];
  const build = () => {
    const deck = FACES.concat(FACES).map((img, i) => ({ img, id: i }));
    for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = deck[i]; deck[i] = deck[j]; deck[j] = t; }
    return deck.map((c, i) => ({ img: c.img, key: i, flipped: false, matched: false }));
  };
  const [cards, setCards] = useState(build);
  const [picked, setPicked] = useState([]);
  const pickedRef = useRef([]);
  const [moves, setMoves] = useState(0);
  const lock = useRef(false);
  const timer = useRef(0);
  useEffect(() => () => clearTimeout(timer.current), []);
  const flip = (i) => {
    if (lock.current || cards[i].matched || cards[i].flipped || pickedRef.current.indexOf(i) >= 0 || pickedRef.current.length >= 2) return;
    const next = cards.slice(); next[i] = { ...next[i], flipped: true };
    setCards(next);
    const now = pickedRef.current.concat(i);
    pickedRef.current = now;
    setPicked(now);
    if (now.length === 2) {
      setMoves(m => m + 1);
      lock.current = true;
      const a = now[0], b = now[1];
      const hit = cards[a].img === cards[b].img;
      timer.current = setTimeout(() => {
        setCards(prev => prev.map((c, k) => (k === a || k === b) ? (hit ? { ...c, matched: true } : { ...c, flipped: false }) : c));
        pickedRef.current = [];
        setPicked([]);
        lock.current = false;
      }, hit ? 380 : 720);
    }
  };
  const reset = () => { clearTimeout(timer.current); lock.current = false; pickedRef.current = []; setCards(build()); setPicked([]); setMoves(0); };
  const pairs = cards.filter(c => c.matched).length / 2;
  const won = pairs === FACES.length;
  useEffect(() => { if (won && onSolved) onSolved(); }, [won]);
  return (
    <div className="max-w-2xl mx-auto">
      <div className="flex items-center justify-center gap-4 sm:gap-8 mb-6 text-center">
        <div><div className="stat-num text-primary text-xl sm:text-2xl font-serif italic">{moves}</div><div className="text-gray-500 text-[10px] sm:text-xs tracking-widest mt-1">步数</div></div>
        <div className="w-px h-8 bg-white/10" />
        <div><div className="stat-num text-primary text-xl sm:text-2xl font-serif italic">{pairs} / {FACES.length}</div><div className="text-gray-500 text-[10px] sm:text-xs tracking-widest mt-1">已配对</div></div>
        <div className="w-px h-8 bg-white/10" />
        <button onClick={reset} className="text-[11px] sm:text-xs text-primary/80 border border-primary/30 rounded-full px-4 py-1.5 hover:bg-primary/10 hover:text-primary transition-colors">重新开始</button>
      </div>
      <div className="mg-grid">
        {cards.map((c, i) => (
          <button key={c.key} className={`mg-card${c.flipped || c.matched ? ' mg-card--flipped' : ''}${c.matched ? ' mg-card--matched' : ''}`} onClick={() => flip(i)} aria-label={c.matched || c.flipped ? '已翻开的图片卡' : '未翻开的卡片'} data-matched={c.matched ? '1' : '0'}>
            <span className="mg-card__inner">
              <span className="mg-card__face mg-card__back"><span>文</span></span>
              <span className="mg-card__face mg-card__front"><img src={c.img} alt="" draggable="false" /></span>
            </span>
          </button>
        ))}
      </div>
      {won && (
        <div className="mg-win mt-8 text-center">
          <div className="font-serif italic text-primary text-2xl md:text-3xl mb-2">全部配对完成！</div>
          <p className="text-gray-400 text-xs sm:text-sm mb-5">你用了 <span className="text-primary">{moves}</span> 步翻开全部 {FACES.length} 组作品照。</p>
          <button onClick={reset} className="inline-flex items-center gap-2 bg-primary rounded-full text-black font-medium text-sm pl-5 pr-2 py-2 group">
            再来一局
            <span className="bg-black rounded-full w-9 h-9 flex items-center justify-center text-primary group-hover:scale-110 transition-transform"><IconRefresh className="w-4 h-4" /></span>
          </button>
        </div>
      )}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(err){return {err};}
  render(){ if(this.state.err){ return (<div style={{color:'#E1E0CC',fontFamily:'sans-serif',padding:'48px',lineHeight:1.7}}>⚠️ 渲染出错：<br/><span style={{color:'#FB7299'}}>{String(this.state.err&&this.state.err.message||this.state.err)}</span></div>); } return this.props.children; }
}
